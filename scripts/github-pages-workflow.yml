# NOT ACTIVE YET. This file belongs at .github/workflows/deploy.yml, but the
# GitHub token on this machine has no `workflow` scope, so git refuses to push
# anything under .github/workflows. To switch CI deploys on:
#
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows
#   git mv scripts/github-pages-workflow.yml .github/workflows/deploy.yml
#   git commit -m "Deploy from Actions" && git push
#
# Until then, `npm run deploy` publishes dist/ to the gh-pages branch by hand.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The board data is the game: a badly balanced board is unplayable and the
      # damage only shows up mid-round. Never ship without this passing.
      - run: npm run check:boards
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
